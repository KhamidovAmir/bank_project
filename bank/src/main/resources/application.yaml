spring:
  application:
    name: bank
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:bank}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:replace-this-with-long-secret-key-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:3600000}

